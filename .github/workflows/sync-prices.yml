# Actualiza cada hora los precios de las casas de subastas usadas recientemente.
# El plan Hobby de Vercel solo permite un cron diario; GitHub Actions llama al mismo endpoint.
# Requiere el secreto del repositorio CRON_SECRET (el mismo valor que en Vercel).
# Los errores salen como anotaciones («::error::») para verlos en la lista de ejecuciones sin abrir el registro.
name: Sincronizar precios

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron de la web
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Falta CRON_SECRET::Añade el secreto CRON_SECRET en Settings > Secrets and variables > Actions (mismo valor que en Vercel)."
            exit 1
          fi
          url=https://mercadowowprofesiones.vercel.app/api/cron/sync-prices
          for attempt in 1 2; do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$url" || echo 000)
            echo "Intento $attempt: HTTP $code"
            head -c 2000 resp.json 2>/dev/null; echo
            if [ "$code" = 200 ]; then
              if grep -q '"error"' resp.json; then echo "::warning title=Sincronización parcial::Alguna casa devolvió error; revisa la respuesta en el registro."; fi
              exit 0
            fi
            [ "$attempt" = 1 ] && sleep 20
          done
          case "$code" in
            401) echo "::error title=CRON_SECRET no coincide::La web respondió 401: el secreto de GitHub no es igual al CRON_SECRET de Vercel." ;;
            000) echo "::error title=Sin respuesta::La web no respondió en 90 s." ;;
            *)   echo "::error title=HTTP $code::La web respondió $code al sincronizar precios." ;;
          esac
          exit 1
