# Actualiza cada hora los precios de las casas de subastas usadas recientemente.
# El plan Hobby de Vercel solo permite un cron diario; GitHub Actions llama al mismo endpoint.
# Requiere el secreto del repositorio CRON_SECRET (el mismo valor que en Vercel).
name: Sincronizar precios

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron de la web
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Falta el secreto CRON_SECRET"; exit 1; fi
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://mercadowowprofesiones.vercel.app/api/cron/sync-prices)
          echo "HTTP $code"
          head -c 2000 resp.json; echo
          test "$code" = 200
